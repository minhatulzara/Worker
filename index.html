function searchUser() {
  let input = document.getElementById("searchInput").value.trim().toLowerCase();
  let result = document.getElementById("result");

  if (input === "") {
    result.innerHTML = "<p style='color:red;'>⚠️ Please enter ID or Name</p>";
    return;
  }

  // Match by ID or Name
  let matches = users.filter(u => 
    u.id === input || u.name.toLowerCase().includes(input)
  );

  if (matches.length > 0) {
    let html = "";

    matches.forEach((user, index) => {
      html += `
        <div style="border-bottom:1px solid #ddd; padding-bottom:10px; margin-bottom:10px;">
          <div class="row"><b>🆔 ID:</b> ${user.id}</div>
          <div class="row"><b>📍 Line:</b> ${user.line}</div>
		  <div class="row"><b>👷‍♂️ Post:</b> ${user.Post}</div>
          <div class="row"><b>👤 Name:</b> ${user.name}</div>
          <div class="row"><b>📞 Phone:</b> ${user.phone}</div>

          <a href="tel:${user.phone}">
            <button class="call-btn">📞 Call Now</button>
          </a>
        </div>
      `;
    });

    result.innerHTML = html;

  } else {
    result.innerHTML = "<p style='color:red;'>❌ No user found</p>";
  }
}
